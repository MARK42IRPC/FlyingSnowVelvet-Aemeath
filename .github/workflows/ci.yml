name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall config lib install_deps.py install_deps scripts

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Offline release configuration tests
        run: python -m unittest tests.test_offline_distribution tests.test_update_manager_release_selection tests.test_update_installer -q
