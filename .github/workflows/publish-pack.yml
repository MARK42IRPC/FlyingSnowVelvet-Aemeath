name: Publish offline installer

on:
  push:
    tags:
      - PACK
      - 'v*'
      - 'LTS*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-offline-installer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      NODE_VERSION: 24.13.0
    steps:
      - name: Check out the desktop-pet workspace
        uses: actions/checkout@v4

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate release version and tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (python -c "from pathlib import Path; from scripts.release_common import read_app_version; print(read_app_version(Path.cwd()))").Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'APP_VERSION is empty.' }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -like 'LTS*' -and '${{ github.ref_name }}' -ne $version) {
            throw "Release tag ${{ github.ref_name }} does not match APP_VERSION $version."
          }

      - name: Cache build downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            build/offline-release/resource-cache
            build/offline-release/jieba-fast
            services/dsh-office-runtime/node_modules
          key: windows-offline-release-${{ hashFiles('requirements.txt', 'services/dsh-office-runtime/package-lock.json', 'config/version_info.py') }}

      - name: Prepare isolated CPU build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = (Resolve-Path .).Path
          $build = Join-Path $root 'build/offline-release'
          $venv = Join-Path $build 'venv'
          $site = Join-Path $build 'cpu-site-packages'
          New-Item -ItemType Directory -Force -Path $build, $site | Out-Null
          python -m venv $venv
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install --upgrade pip

          # Install the normal application requirements into a disposable
          # target.  genie-tts is installed without its optional Torch/GUI
          # dependencies; build_offline_distribution resolves its observed
          # bilingual ONNX frontend closure explicitly.
          $requirements = Join-Path $build 'requirements-cpu.txt'
          Get-Content requirements.txt |
            Where-Object {
              $_ -notmatch '^\s*genie-tts\s*([<>=!~]|$)' -and
              $_ -notmatch '^\s*jieba-fast\s*([<>=!~]|$)' -and
              $_ -notmatch '^\s*onnxruntime\s*([<>=!~]|$)' -and
              $_ -notmatch '^\s*vosk\s*([<>=!~]|$)'
            } |
            Set-Content -Encoding utf8 $requirements
          & $python -m pip install --only-binary=:all: --target $site -r $requirements
          & $python -m pip install --target $site --no-deps genie-tts==2.0.2
          & $python -m pip install --only-binary=:all: --upgrade --target $site `
            'onnx>=1.17' 'onnxruntime==1.22.0' 'tokenizers' 'pypinyin' 'g2pM' `
            'nltk' 'regex' 'jieba'

          # jieba-fast 0.53 has no PyPI wheel for Windows.  Use the project
          # resource mirror and verify the pinned artifact before installing.
          $jiebaName = 'jieba_fast-0.53-cp311-cp311-win_amd64.whl'
          $jiebaHash = 'a5d9cf41d6817963a73f672a429dbfe5b03a4ff327cedf490d5f2b21be8c00d0'
          $jiebaDir = Join-Path $build 'jieba-fast'
          New-Item -ItemType Directory -Force -Path $jiebaDir | Out-Null
          $jiebaWheel = Join-Path $jiebaDir $jiebaName
          $jiebaPart = "$jiebaWheel.part"
          $jiebaUrls = @(
            "https://gitee.com/Mark42IRPC/Aemeath-AIdeskpet/releases/download/RESC/$jiebaName",
            "https://github.com/MARK42IRPC/FlyingSnowVelvet-Aemeath/releases/download/RESC/$jiebaName"
          )
          $jiebaReady = $false
          if (Test-Path $jiebaWheel) {
            $jiebaReady = ((Get-FileHash -Algorithm SHA256 -LiteralPath $jiebaWheel).Hash.ToLowerInvariant() -eq $jiebaHash)
            if (-not $jiebaReady) { Remove-Item -LiteralPath $jiebaWheel -Force }
          }
          if (-not $jiebaReady) {
            foreach ($jiebaUrl in $jiebaUrls) {
              try {
                Remove-Item -LiteralPath $jiebaPart -Force -ErrorAction SilentlyContinue
                Invoke-WebRequest -UseBasicParsing -Uri $jiebaUrl -OutFile $jiebaPart -TimeoutSec 300
                $actualJiebaHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $jiebaPart).Hash.ToLowerInvariant()
                if ($actualJiebaHash -ne $jiebaHash) { throw "jieba-fast SHA-256 mismatch: $actualJiebaHash" }
                Move-Item -LiteralPath $jiebaPart -Destination $jiebaWheel -Force
                $jiebaReady = $true
                break
              } catch { Remove-Item -LiteralPath $jiebaPart -Force -ErrorAction SilentlyContinue }
            }
          }
          if (-not $jiebaReady) { throw 'jieba-fast wheel could not be downloaded and verified.' }
          & $python -m pip install --upgrade --target $site --no-deps $jiebaWheel
          $jiebaInstalled = Join-Path $site 'jieba_fast'
          if (-not (Test-Path $jiebaInstalled)) { throw 'jieba-fast installation is incomplete.' }

          # Vosk 0.3.45 depends on srt 3.5.3, which is a pure-Python source
          # distribution without a Windows wheel. Install that small fallback
          # separately, then install the verified Vosk wheel without resolving
          # its dependency graph again.
          & $python -m pip install --target $site 'srt==3.5.3'
          & $python -m pip install --only-binary=:all: --upgrade --target $site --no-deps 'vosk==0.3.45'
          if (-not (Test-Path (Join-Path $site 'srt.py')) -or -not (Test-Path (Join-Path $site 'vosk'))) {
            throw 'Vosk/srt installation is incomplete.'
          }

          # Download the optional DirectML wheel as a separate overlay.  It
          # never enters the CPU site-packages tree.
          $wheelDir = Join-Path $build 'directml'
          New-Item -ItemType Directory -Force -Path $wheelDir | Out-Null
          & $python -m pip download --no-deps --only-binary=:all: `
            --dest $wheelDir onnxruntime-directml==1.22.0
          $wheel = Get-ChildItem $wheelDir -Filter 'onnxruntime_directml-1.22.0-*.whl' | Select-Object -First 1
          if ($null -eq $wheel) { throw 'DirectML wheel was not downloaded.' }

          "BUILD_ROOT=$build" >> $env:GITHUB_ENV
          "BUILD_PYTHON=$python" >> $env:GITHUB_ENV
          "CPU_SITE=$site" >> $env:GITHUB_ENV
          "DIRECTML_WHEEL=$($wheel.FullName)" >> $env:GITHUB_ENV

      - name: Prepare bundled models and SEanima folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          function Test-ResourceArchive([string]$archive, [string]$expectedRoot) {
            $zip = $null
            try {
              $zip = [IO.Compression.ZipFile]::OpenRead($archive)
              foreach ($entry in $zip.Entries) {
                $parts = $entry.FullName.Trim('/').Split('/')
                if ($parts -contains $expectedRoot) { return $true }
              }
              return $false
            } catch { return $false }
            finally { if ($null -ne $zip) { $zip.Dispose() } }
          }
          function Get-Resource([string]$name, [string]$expectedRoot) {
            $urls = @(
              "https://gitee.com/Mark42IRPC/Aemeath-AIdeskpet/releases/download/RESC/$name",
              "https://github.com/MARK42IRPC/FlyingSnowVelvet-Aemeath/releases/download/RESC/$name"
            )
            $cache = Join-Path $env:BUILD_ROOT 'resource-cache'
            New-Item -ItemType Directory -Force -Path $cache | Out-Null
            $destination = Join-Path $cache $name
            if (Test-Path $destination) {
              if (Test-ResourceArchive $destination $expectedRoot) { return $destination }
              Remove-Item -LiteralPath $destination -Force -ErrorAction SilentlyContinue
            }
            $partial = "$destination.part"
            foreach ($url in $urls) {
              try {
                Remove-Item -LiteralPath $partial -Force -ErrorAction SilentlyContinue
                Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $partial -TimeoutSec 300
                if (-not (Test-ResourceArchive $partial $expectedRoot)) { throw "Resource archive lacks $expectedRoot" }
                Move-Item -LiteralPath $partial -Destination $destination -Force
                return $destination
              } catch { Remove-Item -LiteralPath $partial -Force -ErrorAction SilentlyContinue }
            }
            throw "Unable to download resource: $name"
          }
          function Expand-Resource([string]$archiveName, [string]$destination, [string]$expectedRoot) {
            $archive = Get-Resource $archiveName $expectedRoot
            $temp = Join-Path $env:BUILD_ROOT ("extract-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Force -Path $temp | Out-Null
            Expand-Archive -LiteralPath $archive -DestinationPath $temp -Force
            $candidate = Get-ChildItem -LiteralPath $temp -Directory -Recurse |
              Where-Object { $_.Name -ieq $expectedRoot } | Select-Object -First 1
            if ($null -eq $candidate) { throw "Resource archive lacks $expectedRoot" }
            $target = Join-Path $destination $expectedRoot
            Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Move-Item -LiteralPath $candidate.FullName -Destination $target
            Remove-Item -LiteralPath $temp -Recurse -Force
          }
          $models = Join-Path (Resolve-Path .).Path 'resc/models'
          Expand-Resource 'vosk-model-small-cn-0.22.zip' $models 'vosk-model-small-cn-0.22'
          Expand-Resource 'vosk-model-small-en-us-0.15.zip' $models 'vosk-model-small-en-us-0.15'
          $gif = Join-Path (Resolve-Path .).Path 'resc/GIF'
          Expand-Resource 'SEanima.zip' $gif 'SEanima'

      - name: Prepare bundled Node and DSH production dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $resourceCache = Join-Path $env:BUILD_ROOT 'resource-cache'
          New-Item -ItemType Directory -Force -Path $resourceCache | Out-Null
          $nodeArchive = Join-Path $resourceCache "node-v$env:NODE_VERSION-win-x64.zip"
          $nodeArchivePart = "$nodeArchive.part"
          $expectedNodeHash = (& $env:BUILD_PYTHON -c "from lib.core.dsh_runtime_contract import NODE_ARCHIVE_SHA256; print(NODE_ARCHIVE_SHA256)").Trim()
          if (Test-Path $nodeArchive) {
            $cachedNodeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $nodeArchive).Hash.ToLowerInvariant()
            if ($cachedNodeHash -ne $expectedNodeHash.ToLowerInvariant()) {
              Remove-Item -LiteralPath $nodeArchive -Force
            }
          }
          if (-not (Test-Path $nodeArchive)) {
            $nodeUrls = @(
              "https://npmmirror.com/mirrors/node/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip",
              "https://mirrors.cloud.tencent.com/nodejs-release/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip",
              "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip"
            )
            foreach ($nodeUrl in $nodeUrls) {
              try {
                Remove-Item -LiteralPath $nodeArchivePart -Force -ErrorAction SilentlyContinue
                Invoke-WebRequest -UseBasicParsing -Uri $nodeUrl -OutFile $nodeArchivePart -TimeoutSec 300
                $downloadedNodeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $nodeArchivePart).Hash.ToLowerInvariant()
                if ($downloadedNodeHash -ne $expectedNodeHash.ToLowerInvariant()) {
                  throw "Node archive SHA-256 mismatch from ${nodeUrl}: $downloadedNodeHash"
                }
                Move-Item -LiteralPath $nodeArchivePart -Destination $nodeArchive -Force
                break
              } catch {
                Remove-Item -LiteralPath $nodeArchivePart -Force -ErrorAction SilentlyContinue
              }
            }
          }
          if (-not (Test-Path $nodeArchive)) { throw 'Node archive could not be downloaded from any mirror.' }
          $actualNodeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $nodeArchive).Hash.ToLowerInvariant()
          if ($actualNodeHash -ne $expectedNodeHash.ToLowerInvariant()) { throw "Node archive SHA-256 mismatch: $actualNodeHash" }
          $nodeExtract = Join-Path $env:BUILD_ROOT 'node-extract'
          Expand-Archive -LiteralPath $nodeArchive -DestinationPath $nodeExtract -Force
          $nodeRuntime = Get-ChildItem $nodeExtract -Directory | Select-Object -First 1
          if ($null -eq $nodeRuntime -or -not (Test-Path (Join-Path $nodeRuntime.FullName 'node.exe'))) { throw 'Node runtime is incomplete.' }
          $env:PATH = "$($nodeRuntime.FullName);$env:PATH"
          $dsh = Join-Path (Resolve-Path .).Path 'services/dsh-office-runtime'
          $dshError = (& $env:BUILD_PYTHON -c "from pathlib import Path; from lib.core.dsh_runtime_contract import installed_runtime_error; print(installed_runtime_error(Path.cwd()))").Trim()
          if (-not [string]::IsNullOrWhiteSpace($dshError)) {
            Push-Location $dsh
            try {
              & (Join-Path $nodeRuntime.FullName 'node.exe') (Join-Path $nodeRuntime.FullName 'node_modules/npm/bin/npm-cli.js') `
                ci --omit=dev --ignore-scripts --no-audit --no-fund
            } finally { Pop-Location }
          }
          "NODE_RUNTIME=$($nodeRuntime.FullName)" >> $env:GITHUB_ENV
          if (-not (Test-Path (Join-Path $dsh 'node_modules/@deepseek-ai/dsh/lib/bin.js'))) {
            throw 'DSH production node_modules is incomplete.'
          }

      - name: Build the unified offline payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (& $env:BUILD_PYTHON -c "from pathlib import Path; from scripts.release_common import read_app_version; print(read_app_version(Path.cwd()))").Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'APP_VERSION is empty.' }
          $workspace = Join-Path $env:BUILD_ROOT 'workspace'
          & $env:BUILD_PYTHON scripts/build_offline_distribution.py `
            --source-root (Resolve-Path .).Path `
            --workspace $workspace `
            --python-home ((& python -c 'import sys; print(sys.prefix)').Trim()) `
            --site-packages $env:CPU_SITE `
            --dsh-node-runtime $env:NODE_RUNTIME `
            --dsh-node-modules ((Resolve-Path services/dsh-office-runtime/node_modules).Path) `
            --directml-wheel $env:DIRECTML_WHEEL `
            --clean
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installer = Join-Path (Resolve-Path dist).Path "FlyingSnowVelvet-$version-Offline-Installer.exe"
          & $env:BUILD_PYTHON scripts/build_offline_installer.py --workspace $workspace --version $version --output $installer
          if (-not (Test-Path $installer)) { throw 'Offline installer was not created.' }
          & $env:BUILD_PYTHON -c "from pathlib import Path; from lib.script.app.update_installer import validate_update_installer; validate_update_installer(Path(r'$installer'))"
          Copy-Item -LiteralPath (Join-Path $workspace 'manifest.json') -Destination (Join-Path (Resolve-Path dist).Path "FlyingSnowVelvet-$version-manifest.json")
          Get-FileHash -Algorithm SHA256 -LiteralPath $installer, (Join-Path (Resolve-Path dist).Path "FlyingSnowVelvet-$version-manifest.json")
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "INSTALLER_PATH=$installer" >> $env:GITHUB_ENV

      - name: Install Hub publishing SDKs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:BUILD_PYTHON -m pip install huggingface_hub modelscope

      - name: Wrap and publish the installer to voice-package hubs
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $publishRoot = Join-Path $env:BUILD_ROOT 'voice-package-publication'
          $manifestName = "FlyingSnowVelvet-$env:RELEASE_VERSION-manifest.json"
          $manifest = Join-Path (Resolve-Path dist).Path $manifestName
          & $env:BUILD_PYTHON scripts/publish_offline_installer.py `
            --installer $env:INSTALLER_PATH `
            --version $env:RELEASE_VERSION `
            --revision '${{ github.sha }}' `
            --published-at ((Get-Date).ToUniversalTime().ToString('o')) `
            --manifest $manifest `
            --output-dir $publishRoot
