name: Publish PACK release

on:
  push:
    tags:
      - PACK

permissions:
  contents: write

concurrency:
  group: publish-pack
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out tagged snapshot
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch verified normal package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& python -c 'from pathlib import Path; from scripts.release_common import read_app_version; print(read_app_version(Path.cwd()))' |
            Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not read APP_VERSION.'
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zipPath = (Join-Path (Resolve-Path dist).Path "FlyingSnowVelvet-$version.zip")
          $manifestPath = (Join-Path (Resolve-Path dist).Path "FlyingSnowVelvet-$version-manifest.json")
          $sourceRoot = 'https://gitee.com/Mark42IRPC/Aemeath-AIdeskpet/releases/download/%E6%9C%80%E6%96%B0%E5%8C%85'
          curl.exe --fail --location --retry 5 --retry-all-errors `
            --connect-timeout 20 --max-time 300 `
            --output $zipPath "$sourceRoot/FlyingSnowVelvet-$version.zip"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not download the verified normal ZIP from Gitee.'
          }
          curl.exe --fail --location --retry 5 --retry-all-errors `
            --connect-timeout 20 --max-time 120 `
            --output $manifestPath "$sourceRoot/FlyingSnowVelvet-$version-manifest.json"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not download the verified normal manifest from Gitee.'
          }
          python -c 'import json,sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); actual={i.filename for i in z.infolist()}; z.close(); listed={i["path"] for i in json.load(open(sys.argv[2],encoding="utf-8"))}; raise SystemExit(1 if bad or actual != listed else 0)' $zipPath $manifestPath
          if ($LASTEXITCODE -ne 0) {
            throw 'The mirrored ZIP or manifest failed validation.'
          }
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "manifest_path=$manifestPath" >> $env:GITHUB_OUTPUT
          Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath, $manifestPath

      - name: Upload PACK release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $currentZip = [IO.Path]::GetFileName('${{ steps.package.outputs.zip_path }}')
          $currentManifest = [IO.Path]::GetFileName('${{ steps.package.outputs.manifest_path }}')
          $assetNames = @(gh release view PACK --json assets --jq '.assets[].name' --repo '${{ github.repository }}')
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not list existing PACK release assets.'
          }
          foreach ($assetName in $assetNames) {
            $isPackage = $assetName -like 'FlyingSnowVelvet-*.zip' -or $assetName -like 'FlyingSnowVelvet-*-manifest.json'
            $isCurrent = $assetName -eq $currentZip -or $assetName -eq $currentManifest
            if ($isPackage -and -not $isCurrent) {
              gh release delete-asset PACK $assetName --yes --repo '${{ github.repository }}'
              if ($LASTEXITCODE -ne 0) {
                throw "Could not delete stale PACK asset: $assetName"
              }
            }
          }
          gh release upload PACK `
            '${{ steps.package.outputs.zip_path }}' `
            '${{ steps.package.outputs.manifest_path }}' `
            --clobber `
            --repo '${{ github.repository }}'

      - name: Remove stale build diagnostics
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset PACK pack-build-diagnostic.log `
            --yes `
            --repo '${{ github.repository }}'
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'No stale PACK diagnostics asset was present.'
          }
          exit 0
