name: Publish PACK release

on:
  push:
    tags:
      - PACK

permissions:
  contents: write

concurrency:
  group: publish-pack
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out tagged snapshot
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build normal package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& python -c 'from config.version_info import APP_VERSION; print(APP_VERSION)' |
            Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not read APP_VERSION.'
          }
          $buildLog = Join-Path $env:RUNNER_TEMP 'pack-build-output.log'
          $buildErrorLog = Join-Path $env:RUNNER_TEMP 'pack-build-error.log'
          $pythonPath = (Get-Command python).Source
          $process = Start-Process -FilePath $pythonPath `
            -ArgumentList @('scripts/package_release.py', '--version', $version) `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $buildLog `
            -RedirectStandardError $buildErrorLog
          Get-Content -LiteralPath $buildLog, $buildErrorLog | Write-Host
          $buildExitCode = $process.ExitCode
          if ($buildExitCode -ne 0) {
            $tail = (Get-Content -LiteralPath $buildLog | Select-Object -Last 30) -join "`n"
            $encodedTail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=.github/workflows/publish-pack.yml,line=52::$encodedTail"
            throw "Normal package build failed with exit code $buildExitCode.`n$tail"
          }
          $zipPath = (Resolve-Path -LiteralPath "dist/FlyingSnowVelvet-$version.zip").Path
          $manifestPath = (Resolve-Path -LiteralPath "dist/FlyingSnowVelvet-$version-manifest.json").Path
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "manifest_path=$manifestPath" >> $env:GITHUB_OUTPUT
          Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath, $manifestPath

      - name: Upload PACK release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload PACK `
            '${{ steps.package.outputs.zip_path }}' `
            '${{ steps.package.outputs.manifest_path }}' `
            --clobber `
            --repo '${{ github.repository }}'

      - name: Publish temporary build diagnostics
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $diagnostic = Join-Path $env:RUNNER_TEMP 'pack-build-diagnostic.log'
          '--- stdout ---' | Set-Content -LiteralPath $diagnostic -Encoding utf8
          $stdout = Join-Path $env:RUNNER_TEMP 'pack-build-output.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pack-build-error.log'
          if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout | Add-Content -LiteralPath $diagnostic -Encoding utf8 }
          '--- stderr ---' | Add-Content -LiteralPath $diagnostic -Encoding utf8
          if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr | Add-Content -LiteralPath $diagnostic -Encoding utf8 }
          gh release upload PACK $diagnostic --clobber --repo '${{ github.repository }}'
