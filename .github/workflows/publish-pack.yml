name: Publish PACK release

on:
  push:
    tags:
      - PACK

permissions:
  contents: write

concurrency:
  group: publish-pack
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out tagged snapshot
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build normal package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& python -c 'from pathlib import Path; from scripts.release_common import read_app_version; print(read_app_version(Path.cwd()))' |
            Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not read APP_VERSION.'
          }
          python scripts/package_release.py --version $version
          if ($LASTEXITCODE -ne 0) {
            throw "Normal package build failed with exit code $LASTEXITCODE."
          }
          $zipPath = (Resolve-Path -LiteralPath "dist/FlyingSnowVelvet-$version.zip").Path
          $manifestPath = (Resolve-Path -LiteralPath "dist/FlyingSnowVelvet-$version-manifest.json").Path
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "manifest_path=$manifestPath" >> $env:GITHUB_OUTPUT
          Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath, $manifestPath

      - name: Upload PACK release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload PACK `
            '${{ steps.package.outputs.zip_path }}' `
            '${{ steps.package.outputs.manifest_path }}' `
            --clobber `
            --repo '${{ github.repository }}'

      - name: Remove stale build diagnostics
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset PACK pack-build-diagnostic.log `
            --yes `
            --repo '${{ github.repository }}'
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'No stale PACK diagnostics asset was present.'
          }
          exit 0
